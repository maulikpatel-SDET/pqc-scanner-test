# Standalone cert-manager Issuer + Certificate. TEST ONLY.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: legacy-rsa
spec:
  secretName: legacy-rsa
  commonName: legacy.testbed.local
  issuerRef: { name: selfsigned, kind: ClusterIssuer }
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 1024
