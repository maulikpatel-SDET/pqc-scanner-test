# Istio mesh TLS settings allowing TLS 1.0 and RSA/ECDHE suites. TEST ONLY.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  meshConfig:
    meshMTLS:
      minProtocolVersion: TLSV1_0
    tlsDefaults:
      ecdhCurves: ["P-256"]
      cipherSuites: ["ECDHE-RSA-AES128-SHA", "DES-CBC3-SHA"]
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: legacy-backend
spec:
  host: legacy.default.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      minProtocolVersion: TLSV1_0
      maxProtocolVersion: TLSV1_1
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: gw
spec:
  servers:
    - port: { number: 443, name: https, protocol: HTTPS }
      hosts: ["*"]
      tls:
        mode: SIMPLE
        credentialName: testbed-tls
        minProtocolVersion: TLSV1_0
        cipherSuites: ["ECDHE-RSA-AES128-SHA", "AES128-SHA"]
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: PERMISSIVE
