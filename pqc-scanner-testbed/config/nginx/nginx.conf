# nginx with TLS 1.0/1.1, 3DES, RC4 and an RSA cert. TEST ONLY.
events {}
http {
  server {
    listen 443 ssl;
    server_name testbed.local;
    ssl_certificate     /etc/ssl/certs/rsa_server.cert;
    ssl_certificate_key /etc/ssl/private/rsa_private.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers "DES-CBC3-SHA:RC4-SHA:ECDHE-RSA-AES128-SHA:AES128-SHA";
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve prime256v1;
    ssl_dhparam /etc/ssl/dhparam1024.pem;
    add_header Public-Key-Pins 'pin-sha256="d6qzRu9zOECb90Uez27xWltNsj0e1Md7GkYYkVoZWmM="; max-age=5184000';
  }
}
