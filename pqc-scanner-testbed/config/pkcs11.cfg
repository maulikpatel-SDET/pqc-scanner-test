# PKCS#11 provider for RSA keys in an HSM. TEST ONLY.
name = TestbedHSM
library = /usr/lib/softhsm/libsofthsm2.so
slot = 0
attributes(generate, CKO_PRIVATE_KEY, CKK_RSA) = {
  CKA_SIGN = true
  CKA_DECRYPT = true
}
attributes(generate, CKO_PRIVATE_KEY, CKK_EC) = {
  CKA_SIGN = true
}
disabledMechanisms = {
  CKM_SHA256_RSA_PKCS
}
