# strongSwan IPsec with 3DES, SHA-1, MD5 and DH group 2 (modp1024). TEST ONLY.
config setup
  uniqueids=no

conn legacy-site
  keyexchange=ikev1
  ike=3des-sha1-modp1024,aes128-md5-modp1024!
  esp=3des-sha1,des-md5!
  authby=rsasig
  leftcert=rsa_server.cert
  leftrsasigkey=%cert
  right=203.0.113.10
  auto=start
