# HAProxy with TLS 1.0 minimum and legacy ciphers. TEST ONLY.
global
  ssl-default-bind-options ssl-min-ver TLSv1.0
  ssl-default-bind-ciphers DES-CBC3-SHA:RC4-SHA:ECDHE-RSA-AES128-SHA
  tune.ssl.default-dh-param 1024

frontend https
  bind *:443 ssl crt /etc/haproxy/certs/rsa_server.pem ssl-min-ver TLSv1.0 force-tlsv10
  default_backend app

backend app
  server app1 10.0.0.10:8443 ssl verify none ssl-min-ver TLSv1.0
