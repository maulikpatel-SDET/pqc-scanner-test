# Apache mod_ssl with SSLv3/TLS1.0 and weak ciphers. TEST ONLY.
Listen 443
<VirtualHost *:443>
  ServerName testbed.local
  SSLEngine on
  SSLProtocol all -SSLv2
  SSLCipherSuite HIGH:MEDIUM:3DES:RC4:!aNULL
  SSLCertificateFile /etc/ssl/certs/rsa_server.cert
  SSLCertificateKeyFile /etc/ssl/private/rsa_private.pem
  SSLOpenSSLConfCmd DHParameters /etc/ssl/dhparam1024.pem
  SSLOpenSSLConfCmd Curves prime256v1
</VirtualHost>
